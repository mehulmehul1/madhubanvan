<!-- scallop 5 - small scale + dot row: tiny scales with a row of dots between them, for the muzzle and feet. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- upper pair of tiny scales -->
  <path class="sia" stroke-width="2.2" stroke-linejoin="round"
        d="M6,14 C6,24 16,30 28,30 C40,30 48,24 48,14 C36,14 18,14 6,14 Z"/>
  <path class="sib" stroke-width="2.2" stroke-linejoin="round"
        d="M52,14 C52,24 62,30 74,30 C86,30 94,24 94,14 C82,14 64,14 52,14 Z"/>
  <!-- the wobbling dot-row channel running between the rows -->
  <path class="si" stroke-width="2" stroke-linejoin="round" d="M2,52 C26,46 74,58 98,50"/>
  <circle class="bd" cx="35" cy="51" r="2.4"/>
  <circle class="bd" cx="66" cy="52" r="2.4"/>
  <!-- lower scale, half-offset so the rows interlock -->
  <path class="sia" stroke-width="2.2" stroke-linejoin="round"
        d="M29,66 C29,78 39,86 51,86 C63,86 73,78 73,66 C61,66 41,66 29,66 Z"/>
  <path class="si" stroke-width="1.7" stroke-linejoin="round" d="M36,71 C36,77 44,81 51,81 C58,81 66,77 66,71"/>
</svg>
