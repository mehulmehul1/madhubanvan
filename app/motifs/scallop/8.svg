<!-- scallop 8 - offset brick scales: scales laid as offset brickwork, no stagger of rows. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- upper course: a long scale bleeding left, a short cap bleeding right -->
  <path class="sia" stroke-width="2.8" stroke-linejoin="round"
        d="M-8,10 C-8,26 14,36 40,36 C66,36 84,26 84,10 C60,10 16,10 -8,10 Z"/>
  <path class="sib" stroke-width="2.8" stroke-linejoin="round"
        d="M66,10 C66,26 88,36 108,36 C108,27 108,18 108,10 C94,10 80,10 66,10 Z"/>
  <!-- lower course centred on the joint above, the brick offset -->
  <path class="sia" stroke-width="2.8" stroke-linejoin="round"
        d="M18,56 C18,74 34,87 52,87 C70,87 86,74 86,56 C68,56 36,56 18,56 Z"/>
  <path class="si" stroke-width="1.8" stroke-linejoin="round" d="M28,61 C28,71 39,79 52,79 C65,79 76,71 76,61"/>
  <circle class="bd" cx="52" cy="71" r="2.6"/>
</svg>
