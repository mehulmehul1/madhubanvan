<!-- scallop 11 - scale + arc echo: one scale with concentric echo arcs trailing behind it, for the tail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- the hero scale of the tail, bellied in the second tone -->
  <path class="sib" stroke-width="3.2" stroke-linejoin="round"
        d="M14,38 C14,62 32,80 54,80 C76,80 94,62 94,40 C70,37 38,37 14,38 Z"/>
  <!-- inner echo scale nested in the mouth -->
  <path class="sia" stroke-width="2.4" stroke-linejoin="round"
        d="M30,42 C30,56 40,66 54,66 C68,66 78,56 78,42 C64,42 44,42 30,42 Z"/>
  <!-- one long echo arc trailing off the tile to the right -->
  <path class="si" stroke-width="2.4" stroke-linejoin="round" d="M80,14 C96,34 98,68 84,104"/>
  <circle class="bd" cx="54" cy="54" r="3"/>
</svg>
