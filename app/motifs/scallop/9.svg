<!-- scallop 9 - scale quadrant: a quarter-fan of scales for corners and joints. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- outer quarter wedge anchored off the top-left corner -->
  <path class="sia" stroke-width="2.8" stroke-linejoin="round"
        d="M-6,64 C22,62 52,44 64,14 C67,5 68,0 68,-6 C42,-6 14,-6 -6,-6 C-6,20 -6,44 -6,64 Z"/>
  <!-- inner quarter wedge in the second tone -->
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M-6,40 C12,38 30,28 38,8 C39,2 40,-2 40,-6 C24,-6 8,-6 -6,-6 C-6,8 -6,26 -6,40 Z"/>
  <!-- one radial spoke curving out from the corner -->
  <path class="si" stroke-width="2.2" stroke-linejoin="round" d="M-2,-2 C20,14 34,32 40,56"/>
  <!-- echo arc trailing the fan -->
  <path class="si" stroke-width="1.8" stroke-linejoin="round" d="M70,60 C66,36 56,14 38,-2"/>
  <circle class="bd" cx="24" cy="24" r="2.8"/>
</svg>
