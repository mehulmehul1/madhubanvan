<!-- scallop 4 - scale fan: scales radiating from a point in an arc, for the haunch and shoulder. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- three petals sharing one root below the tile, opening upward like a fan -->
  <path class="sib" stroke-width="3" stroke-linejoin="round"
        d="M50,100 C30,88 15,66 13,38 C33,48 48,70 50,100 Z"/>
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M50,100 C70,88 85,66 87,38 C67,48 52,70 50,100 Z"/>
  <path class="sia" stroke-width="3.2" stroke-linejoin="round"
        d="M50,100 C38,80 38,52 50,26 C62,52 62,80 50,100 Z"/>
  <!-- one travelling echo arc crossing the whole fan -->
  <path class="si" stroke-width="2" stroke-linejoin="round" d="M18,32 C34,42 66,42 82,32"/>
  <circle class="bd" cx="50" cy="54" r="3.2"/>
</svg>
