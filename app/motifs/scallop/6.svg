<!-- scallop 6 - ridge + spine line: scales with a strong vertical spine line through them, for the back. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- the row above bleeding in, so the stack reads imbricated -->
  <path class="si" stroke-width="2" stroke-linejoin="round" d="M30,2 C30,10 40,15 50,15 C60,15 70,10 70,2"/>
  <!-- upper and lower scales straddling the spine -->
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M22,16 C22,33 34,45 50,45 C66,45 78,33 78,16 C64,16 36,16 22,16 Z"/>
  <path class="sib" stroke-width="3" stroke-linejoin="round"
        d="M22,58 C22,76 34,89 50,89 C66,89 78,76 78,58 C64,58 36,58 22,58 Z"/>
  <!-- the spine: one hand-wobbling vertical that bleeds off both edges -->
  <path class="si" stroke-width="3" stroke-linejoin="round" d="M50,-6 C46,18 54,44 49,70 C47,84 51,94 50,106"/>
  <circle class="bd" cx="50" cy="73" r="3"/>
</svg>
