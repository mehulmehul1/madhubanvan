<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- scallop 1 - double scale: a second, smaller scale nested inside the first.
       Two tones in one cell: the outer scale is fill A, the inner is fill B. -->
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <path class="si" stroke-width="2.2" d="M24,2 C24,12 35,19 50,19 C65,19 76,12 76,2"/>
  <!-- outer scale -->
  <path class="sia" stroke-width="3.2" stroke-linejoin="round"
        d="M3,46 C3,68 24,84 50,84 C76,84 97,68 97,46 C76,46 24,46 3,46 Z"/>
  <!-- inner scale, tucked up inside the mouth of the outer one -->
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M22,50 C22,64 34,74 50,74 C66,74 78,64 78,50 C66,50 34,50 22,50 Z"/>
  <circle class="bd" cx="50" cy="61" r="2.9"/>
  <circle class="fi" cx="50" cy="31" r="2.4"/>
</svg>
