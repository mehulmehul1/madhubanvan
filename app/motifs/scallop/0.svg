<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- scallop 0 - the hero scale: one imbricated fish-scale with a centre bead.
       Bomb mode gives every seed its own tile, so a motif is a self-contained mark
       that overlaps its neighbours rather than a seamless repeat. -->
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- the row above, only its lower arc showing: this is what makes it read imbricated -->
  <path class="si" stroke-width="2.4" d="M18,4 C18,16 32,25 50,25 C68,25 82,16 82,4"/>
  <!-- the scale body: arc plus the chord across its mouth -->
  <path class="sia" stroke-width="3.2" stroke-linejoin="round"
        d="M4,50 C4,69 24,83 50,83 C76,83 96,69 96,50 L96,50 C76,50 24,50 4,50 Z"/>
  <!-- inner echo line: the double-line Madhubani uses to give a scale weight -->
  <path class="si" stroke-width="1.7" d="M15,55 C15,66 30,74 50,74 C70,74 85,66 85,55"/>
  <circle class="fb" cx="50" cy="63" r="5.4"/>
  <circle class="bd" cx="50" cy="63" r="3.6"/>
</svg>
