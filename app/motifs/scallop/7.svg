  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- the band edges: two wobbling rules bleeding off both sides -->
  <path class="si" stroke-width="2.4" stroke-linejoin="round" d="M-6,30 C20,24 46,36 70,30 C85,27 96,30 106,28"/>
  <path class="si" stroke-width="2.4" stroke-linejoin="round" d="M-6,72 C26,78 62,64 106,74"/>
  <!-- three small scallops hanging between the rules, alternating tone -->
  <path class="sia" stroke-width="2.4" stroke-linejoin="round"
        d="M8,44 C8,56 18,63 29,63 C40,63 48,56 48,45 C36,43 20,43 8,44 Z"/>
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M39,45 C39,57 44,63 55,63 C66,63 71,57 71,45 C61,43 49,43 39,45 Z"/>
  <path class="sia" stroke-width="2.4" stroke-linejoin="round"
        d="M62,45 C62,56 70,63 81,63 C92,63 98,55 96,44 C86,43 72,43 62,45 Z"/>
  <circle class="bd" cx="55" cy="54" r="2.4"/>
