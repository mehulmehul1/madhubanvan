<!-- bharni 4 - filled peacock: a solid peacock in profile with an eye-spotted fanned tail, for the tail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- fanned tail sweeping up past the top-right edge, twin-lobed outer rim -->
  <path class="sia" stroke-width="3.4" stroke-linejoin="round"
        d="M52,70 C62,58 72,40 78,18 C84,22 88,30 86,40 C90,34 96,30 104,30 C102,42 96,56 84,68 C74,78 62,80 52,70 Z"/>
  <!-- plump body in profile, head knob at top, breast to the left -->
  <path class="sia" stroke-width="3.4" stroke-linejoin="round"
        d="M34,92 C20,88 10,74 12,58 C13,48 20,40 28,38 C27,33 29,28 34,27 C39,26 42,29 42,33 C48,34 54,38 58,44 C64,54 62,72 50,84 C45,88 39,91 34,92 Z"/>
  <!-- three eye-spots on the fan in fill B -->
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M70,52 C66,50 64,46 66,42 C68,38 73,38 75,42 C77,46 74,51 70,52 Z"/>
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M80,44 C77,42 76,39 77,36 C79,33 83,33 84,36 C86,39 83,43 80,44 Z"/>
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M62,62 C59,60 58,57 59,54 C61,51 65,51 66,54 C68,57 65,61 62,62 Z"/>
  <!-- crest flicking off the head -->
  <path class="si" stroke-width="1.2" stroke-linejoin="round" d="M32,28 C30,22 30,16 32,10"/>
  <!-- wing contour over the body fill -->
  <path class="si" stroke-width="1.2" stroke-linejoin="round" d="M24,60 C28,68 34,74 42,76"/>
  <circle class="bd" cx="36" cy="44" r="3"/>
</svg>
