<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- bharni 2 - the kairi paisley: solid mango teardrop in fill A with its tail
       curling off the top edge, nested inner paisley in fill B, ink dots along the edge. -->
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- the great comma: fat round head below, tail hooking up past the edge -->
  <path class="sia" stroke-width="3.4" stroke-linejoin="round"
        d="M52,95 C30,95 10,79 10,56 C10,34 27,19 48,19 C55,19 61,21 66,24 C72,16 76,8 78,-2 C84,0 87,7 85,16 C82,32 72,46 58,52 C50,55 45,61 45,69 C45,80 46,89 52,95 Z"/>
  <!-- nested inner paisley in fill B -->
  <path class="sib" stroke-width="2.6" stroke-linejoin="round"
        d="M50,80 C36,80 24,69 24,55 C24,42 34,33 46,33 C56,33 63,40 63,49 C63,57 57,62 50,61 C46,60 44,64 45,68 C46,75 46,78 50,80 Z"/>
  <!-- inner contour echo following the curl -->
  <path class="si" stroke-width="1.2" stroke-linejoin="round" d="M68,40 C76,30 81,20 82,10"/>
  <!-- row of colour seeds along the inner edge, fill B petals on the curl -->
  <path class="fb" d="M63,41 C65.5,43.5 65.5,47.5 63,50 C60.5,47.5 60.5,43.5 63,41 Z"/>
  <path class="fb" d="M61,48 C63.5,50.5 63.5,54.5 61,57 C58.5,54.5 58.5,50.5 61,48 Z"/>
  <path class="fb" d="M57,55 C59.5,57.5 59.5,61.5 57,64 C54.5,61.5 54.5,57.5 57,55 Z"/>
  <path class="fb" d="M51,60 C53.5,62.5 53.5,66.5 51,69 C48.5,66.5 48.5,62.5 51,60 Z"/>
  <circle class="bd" cx="42" cy="52" r="3.2"/>
</svg>
