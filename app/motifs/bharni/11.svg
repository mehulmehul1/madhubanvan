<!-- bharni 11 - filled medallion band: a row of small filled medallions — a border strip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- three small filled discs in fill A -->
  <circle class="sia" cx="18" cy="48" r="16" stroke-width="3" stroke-linejoin="round"/>
  <circle class="sia" cx="50" cy="48" r="16" stroke-width="3" stroke-linejoin="round"/>
  <circle class="sia" cx="82" cy="48" r="16" stroke-width="3" stroke-linejoin="round"/>
  <!-- inner boss in each disc, fill B -->
  <circle class="sib" cx="18" cy="48" r="7" stroke-width="2" stroke-linejoin="round"/>
  <circle class="sib" cx="50" cy="48" r="7" stroke-width="2" stroke-linejoin="round"/>
  <circle class="sib" cx="82" cy="48" r="7" stroke-width="2" stroke-linejoin="round"/>
  <!-- beads riding in the gaps between medallions -->
  <circle class="bd" cx="34" cy="48" r="2.6"/>
  <circle class="bd" cx="66" cy="48" r="2.6"/>
  <!-- grounding rule the row sits on -->
  <path class="si" stroke-width="1.2" stroke-linejoin="round" d="M-8,78 C30,74 70,82 108,76"/>
</svg>
