<!-- kohbar 1 - the fertility fish: pointed-oval body in A, forked tail in B, bead eye, curved dorsal fin, three gill arcs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- body: pointed snout left, swelling flank, narrowing to the tail wrist -->
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M8,52 C24,30 54,28 76,44 C54,62 24,72 8,52 Z"/>
  <!-- forked tail in B, with a notch cut into the fan -->
  <path class="sib" stroke-width="2.6" stroke-linejoin="round"
        d="M74,41 C82,33 88,25 97,22 C93,32 92,38 94,44 C92,50 93,56 97,66 C88,63 82,55 74,49 Z"/>
  <!-- dorsal fin riding the back curve, solid B like the tail -->
  <path class="sib" stroke-width="2" stroke-linejoin="round"
        d="M38,33 C46,23 58,21 66,26 C58,27 50,30 44,35 Z"/>
  <!-- three short gill arcs behind the head -->
  <path class="si" stroke-width="1.8" stroke-linejoin="round" d="M30,40 C27,46 27,54 30,60"/>
  <path class="si" stroke-width="1.8" stroke-linejoin="round" d="M37,38 C34,46 34,56 37,62"/>
  <path class="si" stroke-width="1.8" stroke-linejoin="round" d="M44,37 C41,46 41,57 44,63"/>
  <!-- tail spine echo -->
  <path class="si" stroke-width="1.6" stroke-linejoin="round" d="M78,44 C84,40 88,36 92,31"/>
  <!-- bead eye near the snout -->
  <circle class="bd" cx="22" cy="48" r="3.4"/>
</svg>
