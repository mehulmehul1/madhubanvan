<!-- kohbar 10 - kalash: decked pot with coconut and leaves at its mouth, for the tail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- round-bellied pot -->
  <path class="sia" stroke-width="2.6" stroke-linejoin="round"
        d="M36,50 C30,62 34,76 50,78 C66,76 70,62 64,50 C56,46 44,46 36,50 Z"/>
  <!-- leaves fanning from the mouth, behind the rim -->
  <path class="sia" stroke-width="2" stroke-linejoin="round"
        d="M46,44 C38,38 30,36 22,38 C30,43 38,46 46,44 Z"/>
  <path class="sib" stroke-width="2" stroke-linejoin="round"
        d="M50,44 C48,34 48,26 50,16 C52,26 52,34 50,44 Z"/>
  <path class="sib" stroke-width="2" stroke-linejoin="round"
        d="M54,44 C62,38 70,36 78,38 C70,43 62,46 54,44 Z"/>
  <!-- mouth rim band -->
  <path class="sib" stroke-width="2" stroke-linejoin="round"
        d="M34,46 C42,42 58,42 66,46 C66,51 62,53 58,53 C50,51 50,51 42,53 C38,53 34,51 34,46 Z"/>
  <!-- coconut nested in the mouth -->
  <path class="fb"
        d="M50,24 C56,24 60,28 60,34 C60,40 55,43 50,43 C45,43 40,40 40,34 C40,28 44,24 50,24 Z"/>
  <!-- belly band and its bead -->
  <path class="si" stroke-width="1.8" stroke-linejoin="round" d="M36,62 C44,66 56,66 64,62"/>
  <circle class="bd" cx="50" cy="69" r="2.6"/>
</svg>
