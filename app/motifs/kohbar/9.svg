<!-- kohbar 9 - lotus border strip: three small lotuses on a waving stem, for the fin. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- runner line the strip grows from, bleeding off both edges -->
  <path class="si" stroke-width="2.2" stroke-linejoin="round"
        d="M-4,80 C20,76 40,84 60,80 C74,77 88,79 104,80"/>
  <!-- three lotus cups with their stems in one stroke each -->
  <path class="sia" stroke-width="2.2" stroke-linejoin="round"
        d="M10,56 C8,46 12,38 20,32 C28,38 32,46 30,56 C24,60 16,60 10,56 Z M20,60 C20,66 20,72 20,78"/>
  <path class="sib" stroke-width="2.2" stroke-linejoin="round"
        d="M40,56 C38,46 42,38 50,32 C58,38 62,46 60,56 C54,60 46,60 40,56 Z M50,60 C50,66 50,72 50,78"/>
  <path class="sia" stroke-width="2.2" stroke-linejoin="round"
        d="M70,56 C68,46 72,38 80,32 C88,38 92,46 90,56 C84,60 76,60 70,56 Z M80,60 C80,66 80,72 80,78"/>
  <!-- unopened buds between the blooms -->
  <path class="fb"
        d="M35,68 C33,63 33,58 35,53 C37,58 37,63 35,68 Z"/>
  <path class="fb"
        d="M65,68 C63,63 63,58 65,53 C67,58 67,63 65,68 Z"/>
  <!-- bead heart of the middle bloom -->
  <circle class="bd" cx="50" cy="47" r="2.6"/>
</svg>
