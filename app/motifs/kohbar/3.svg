<!-- kohbar 3 - framed panel: hand-wobbled outer and inner rules, beads set into the gap, bead heart with an echo ring. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- outer rule, sides bowed slightly outward by hand -->
  <path class="si" stroke-width="3" stroke-linejoin="round"
        d="M12,12 C40,10 64,10 88,12 C90,40 90,62 88,88 C60,90 38,90 12,88 C10,60 10,40 12,12 Z"/>
  <!-- inner rule, echoing the outer with a gap between them -->
  <path class="si" stroke-width="2" stroke-linejoin="round"
        d="M26,26 C44,24.5 58,24.5 74,26 C75.5,44 75.5,58 74,74 C56,75.5 44,75.5 26,74 C24.5,56 24.5,44 26,26 Z"/>
  <!-- filled field inside the inner rule, so the panel carries colour mass -->
  <path class="fb"
        d="M30,30 C46,28.5 56,28.5 70,30 C71,46 71,56 70,70 C56,71 44,71 30,70 C29,56 29,44 30,30 Z"/>
  <!-- two beads marking the channel, top and bottom -->
  <circle class="bd" cx="50" cy="18" r="2.6"/>
  <circle class="bd" cx="50" cy="82" r="2.6"/>
  <!-- centre: echo rings with a bead heart, flanked by a filled leaf pair -->
  <path class="sa" stroke-width="2" stroke-linejoin="round"
        d="M50,38 C58,38 63,44 63,50 C63,56 58,62 50,62 C42,62 37,56 37,50 C37,44 42,38 50,38 Z"/>
  <path class="sa" stroke-width="1.6" stroke-linejoin="round"
        d="M50,43 C54,43 57,46 57,50 C57,54 54,57 50,57 C46,57 43,54 43,50 C43,46 46,43 50,43 Z"/>
  <path class="sia" stroke-width="1.8" stroke-linejoin="round"
        d="M30,50 C34,46 39,45 43,47 C39,51 34,52 30,50 Z"/>
  <path class="sia" stroke-width="1.8" stroke-linejoin="round"
        d="M70,50 C66,46 61,45 57,47 C61,51 66,52 70,50 Z"/>
  <circle class="bd" cx="50" cy="50" r="3.4"/>
</svg>
