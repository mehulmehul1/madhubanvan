<!-- kohbar 4 - peacock: fanned crest tail, each feather eye-spotted, for the wing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- tail fan sweeping up behind the body -->
  <path class="sib" stroke-width="2.6" stroke-linejoin="round"
        d="M58,92 C56,66 64,42 90,24 C96,30 96,52 86,72 C78,84 68,90 58,92 Z"/>
  <!-- plump side-profile body, beak tip at the left -->
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M10,58 C20,44 38,42 50,50 C60,56 62,68 54,78 C42,90 20,82 12,66 C11,63 10,61 10,58 Z"/>
  <!-- three-pronged crest on the crown -->
  <path class="si" stroke-width="2" stroke-linejoin="round"
        d="M22,44 C20,38 18,34 13,30 M26,43 C26,37 26,32 24,26 M30,44 C32,38 34,33 35,27"/>
  <!-- wing arc riding the flank -->
  <path class="si" stroke-width="2" stroke-linejoin="round" d="M28,60 C36,58 46,60 52,68"/>
  <!-- three feather shafts fanning into the tail -->
  <path class="si" stroke-width="1.8" stroke-linejoin="round"
        d="M62,80 C70,66 78,52 88,40 M64,84 C74,74 82,64 90,54 M60,74 C66,58 72,44 82,30"/>
  <!-- eye-spots where the shafts land -->
  <circle class="fb" cx="88" cy="40" r="4"/>
  <circle class="fb" cx="90" cy="54" r="4"/>
  <circle class="fb" cx="82" cy="30" r="4"/>
  <circle class="bd" cx="88" cy="40" r="1.6"/>
  <circle class="bd" cx="90" cy="54" r="1.6"/>
  <circle class="bd" cx="82" cy="30" r="1.6"/>
  <!-- head eye -->
  <circle class="fi" cx="22" cy="56" r="2.4"/>
</svg>
