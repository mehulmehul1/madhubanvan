<!-- kohbar 6 - sun / chakra: rayed disc with concentric rings, for the paws. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- hand-wobbled outer disc -->
  <path class="sib" stroke-width="2.6" stroke-linejoin="round"
        d="M50,28 C62,28 72,38 72,50 C72,62 62,72 50,72 C38,72 28,62 28,50 C28,38 38,28 50,28 Z"/>
  <!-- inner ring echo -->
  <path class="sa" stroke-width="2" stroke-linejoin="round"
        d="M50,38 C56,38 61,43 61,50 C61,57 56,62 50,62 C44,62 39,57 39,50 C39,43 44,38 50,38 Z"/>
  <!-- eight curved ray blades, alternating tones -->
  <path class="sia" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z"/>
  <path class="sib" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z" transform="rotate(45 50 50)"/>
  <path class="sia" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z" transform="rotate(90 50 50)"/>
  <path class="sib" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z" transform="rotate(135 50 50)"/>
  <path class="sia" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z" transform="rotate(180 50 50)"/>
  <path class="sib" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z" transform="rotate(225 50 50)"/>
  <path class="sia" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z" transform="rotate(270 50 50)"/>
  <path class="sib" stroke-width="2" stroke-linejoin="round" d="M50,22 C47,15 47,9 50,2 C53,9 53,15 50,22 Z" transform="rotate(315 50 50)"/>
  <!-- heart of the sun -->
  <circle class="bd" cx="50" cy="50" r="3.4"/>
</svg>
