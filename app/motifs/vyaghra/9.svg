<!-- vyaghra 9 - stripe fan: tapered stripes radiating from one point in an arc, for the fin. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- centre ray in A, straight up past the crown -->
  <path class="sia" stroke-width="2.6" stroke-linejoin="round"
        d="M50,98 C54,70 55,40 52,-8 C52,-10 48,-10 48,-8 C45,40 46,70 46,98 Z"/>
  <!-- inner pair in B, leaning out to either side -->
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M48,96 C44,70 34,44 14,-4 C20,44 32,70 42,98 Z"/>
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M52,96 C56,70 66,44 86,-4 C80,44 68,70 58,98 Z"/>
  <!-- outer pair in A, low arcs bleeding off the flanks -->
  <path class="fa" d="M46,96 C38,72 24,54 2,44 C22,60 36,78 42,98 Z"/>
  <path class="fa" d="M54,96 C62,72 76,54 98,44 C78,60 64,78 58,98 Z"/>
  <!-- arc echo crossing all five rays -->
  <path class="sa" stroke-width="1.6" stroke-linejoin="round" d="M14,60 C32,48 68,48 86,60"/>
  <!-- bead capping the fan's origin where the rays meet -->
  <circle class="bd" cx="50" cy="94" r="3.2"/>
</svg>
