<!-- vyaghra 11 - stripe border band: a stripe with a parallel hairline above and below, an edge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- the centre stripe in A, swelling amidships, bleeding off both edges -->
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M-8,50 C30,42 70,42 108,46 C70,58 30,58 -8,55 Z"/>
  <!-- B band nested inside the centre stripe -->
  <path class="sib" stroke-width="2.2" stroke-linejoin="round"
        d="M-8,51 C32,47 68,47 108,49 C68,54 32,54 -8,53 Z"/>
  <!-- echo line along the centre stripe -->
  <path class="si" stroke-width="1.5" stroke-linejoin="round" d="M4,50 C34,47 66,47 96,49"/>
  <!-- the bordering hairlines, one above and one below -->
  <path class="sa" stroke-width="1.4" stroke-linejoin="round" d="M-8,32 C30,28 70,28 108,30"/>
  <path class="sa" stroke-width="1.4" stroke-linejoin="round" d="M-8,70 C30,66 70,66 108,68"/>
  <!-- beads set in the open ground outside the hairlines -->
  <circle class="bd" cx="30" cy="16" r="2.2"/>
  <circle class="bd" cx="70" cy="86" r="2.2"/>
</svg>
