<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- vyaghra 2 - double band: a thick fill-A tapered band on a rising diagonal
       with a thinner fill-B band nested inside it, a hairline of ground showing
       between the two, and a spine echo down the middle of the inner band. -->
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- outer band, fill A -->
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M-10,52 C25,40 60,38 110,28 C70,52 30,60 -10,62 Z"/>
  <!-- inner band, fill B, floating clear of the outer edge all round -->
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M-10,54 C28,47 62,45 110,37 C70,49 34,52 -10,57 Z"/>
  <!-- spine echo along the inner band -->
  <path class="si" stroke-width="1.5" stroke-linejoin="round" d="M2,51 C30,47 60,45 98,41"/>
  <!-- ground dots above and below the band pair -->
  <circle class="bd" cx="50" cy="74" r="2.6"/>
  <circle class="fi" cx="50" cy="26" r="2"/>
</svg>
