<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- vyaghra 1 - tapered notched stripe: the bold tile. One vertical flame,
       needle-pointed at the crown, swelling wide through the belly, forking
       into two prongs at the root with the notch cut up between them. -->
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- the stripe body: top tip, wide belly, forked root -->
  <path class="sia" stroke-width="3.5" stroke-linejoin="round"
        d="M52,-10 C68,8 80,28 79,50 C78,66 70,78 64,110 L57,92 C55,88 53,86 51,86 C49,86 47,88 45,92 L38,110 C32,78 22,64 23,48 C24,28 36,8 52,-10 Z"/>
  <!-- inner tongue in B floating inside the stripe, giving the second tone -->
  <path class="sib" stroke-width="2.4" stroke-linejoin="round"
        d="M52,20 C59,32 61,46 58,60 C56,67 54,72 55,84 L52,74 C51,71 49,71 48,74 L45,84 C46,72 43,66 44,56 C45,42 47,30 52,20 Z"/>
  <!-- centre vein running the length of the stripe -->
  <path class="si" stroke-width="2" stroke-linejoin="round" d="M52,8 C60,26 62,52 52,74"/>
  <!-- short barb flicks off the vein toward each flank -->
  <path class="si" stroke-width="1.6" stroke-linejoin="round" d="M32,38 C37,42 42,44 48,45"/>
  <path class="si" stroke-width="1.6" stroke-linejoin="round" d="M72,38 C67,42 62,44 56,45"/>
  <!-- bead seated on the vein at the belly's widest point -->
  <circle class="bd" cx="52" cy="54" r="3"/>
</svg>
