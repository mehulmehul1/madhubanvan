<!-- vyaghra 6 - stripe ladder: two tapered rails joined by short rungs, for the neck. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- left rail in A -->
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M32,-8 C38,18 39,50 36,78 C35,90 34,100 33,108 L29,92 C26,72 25,46 27,24 C28,8 29,-2 28,-8 Z"/>
  <!-- right rail in B -->
  <path class="sib" stroke-width="3" stroke-linejoin="round"
        d="M68,-8 C74,18 75,50 72,78 C71,90 70,100 69,108 L65,92 C62,72 61,46 63,24 C64,8 65,-2 64,-8 Z"/>
  <!-- three rungs spanning the rails, alternating A and B -->
  <path class="fa" d="M32,30 C42,26 56,26 68,30 C56,35 42,35 32,30 Z"/>
  <path class="fb" d="M31,52 C42,48 58,48 69,52 C58,57 42,57 31,52 Z"/>
  <path class="fa" d="M32,74 C42,70 56,70 68,74 C56,79 42,79 32,74 Z"/>
  <!-- echo line along the left rail -->
  <path class="si" stroke-width="1.5" stroke-linejoin="round" d="M31,12 C34,36 34,64 30,92"/>
  <!-- bead crowning the ladder -->
  <circle class="bd" cx="50" cy="12" r="2.6"/>
</svg>
