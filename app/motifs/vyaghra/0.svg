<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- vyaghra 0 - plain bands: two horizontal tapered stripes bleeding off both
       edges, one fill A and one fill B, each swelling mid-body and pinching at
       its tips, with an ink echo line and ground dots between them. -->
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <!-- upper band, fill A: lens that swells amidships, points at both bleeds -->
  <path class="sia" stroke-width="3" stroke-linejoin="round"
        d="M-8,30 C20,20 60,19 108,11 C66,29 22,35 -8,34 Z"/>
  <!-- echo line inside the upper band -->
  <path class="si" stroke-width="1.6" stroke-linejoin="round" d="M6,28 C32,22 64,21 94,16"/>
  <!-- lower band, fill B: same lens, slightly bellied the other way -->
  <path class="sib" stroke-width="3" stroke-linejoin="round"
        d="M-8,63 C30,57 70,60 108,52 C68,71 28,73 -8,69 Z"/>
  <!-- echo line inside the lower band -->
  <path class="si" stroke-width="1.6" stroke-linejoin="round" d="M6,65 C35,62 66,63 94,58"/>
  <!-- ground beads floating between the bands -->
  <circle class="bd" cx="50" cy="46" r="2.6"/>
  <circle class="fi" cx="20" cy="46" r="1.8"/>
  <circle class="fi" cx="80" cy="46" r="1.8"/>
</svg>
