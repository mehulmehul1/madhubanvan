<!-- tantrik 3 - star grid: a crisp 2x2 grid of 8-point stars, each two overlapping squares at 45 degrees, checkerboarded A-over-B and B-over-A, bead at each star centre, B bindu at the grid centre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <rect class="sib" stroke-width="2.2" stroke-linejoin="round" x="18" y="18" width="24" height="24"/>
  <rect class="sia" stroke-width="2.2" stroke-linejoin="round" transform="rotate(45 30 30)" x="18" y="18" width="24" height="24"/>
  <circle class="bd" cx="30" cy="30" r="2.6"/>
  <rect class="sia" stroke-width="2.2" stroke-linejoin="round" x="58" y="18" width="24" height="24"/>
  <rect class="sib" stroke-width="2.2" stroke-linejoin="round" transform="rotate(45 70 30)" x="58" y="18" width="24" height="24"/>
  <circle class="bd" cx="70" cy="30" r="2.6"/>
  <rect class="sia" stroke-width="2.2" stroke-linejoin="round" x="18" y="58" width="24" height="24"/>
  <rect class="sib" stroke-width="2.2" stroke-linejoin="round" transform="rotate(45 30 70)" x="18" y="58" width="24" height="24"/>
  <circle class="bd" cx="30" cy="70" r="2.6"/>
  <rect class="sib" stroke-width="2.2" stroke-linejoin="round" x="58" y="58" width="24" height="24"/>
  <rect class="sia" stroke-width="2.2" stroke-linejoin="round" transform="rotate(45 70 70)" x="58" y="58" width="24" height="24"/>
  <circle class="bd" cx="70" cy="70" r="2.6"/>
  <circle class="fb" cx="50" cy="50" r="4"/>
</svg>
