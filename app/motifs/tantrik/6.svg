<!-- tantrik 6 - nested squares: squares rotated 45 degrees inside each other. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect class="g" x="0" y="0" width="100" height="100"/>
  <rect class="si" stroke-width="2.4" stroke-linejoin="round" x="10" y="10" width="80" height="80"/>
  <rect class="sa" stroke-width="2.2" stroke-linejoin="round" transform="rotate(45 50 50)" x="22" y="22" width="56" height="56"/>
  <rect class="sib" stroke-width="2.2" stroke-linejoin="round" x="31" y="31" width="38" height="38"/>
  <rect class="sia" stroke-width="2" stroke-linejoin="round" transform="rotate(45 50 50)" x="37" y="37" width="26" height="26"/>
  <rect class="fb" transform="rotate(45 50 50)" x="45" y="45" width="10" height="10"/>
  <circle class="bd" cx="50" cy="50" r="2.4"/>
</svg>
